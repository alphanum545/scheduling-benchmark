# Algorithm registry — CGS paper (paper/cgs-final)
#
# This branch carries ONLY the algorithms used in the CGS paper's Results section:
# the proposed method CGS, its ablation, and six published baselines. The full
# research registry (126 algorithms, 89 with dev coverage) lives on main and on
# the research branches; it is deliberately not reproduced here.
#
# Selection rationale (see the paper's Experimental Setup):
#   - HEFT + insertion  : the canonical list-scheduling baseline, insertion-based
#                         to match CGS's own placement rule.
#   - PEFT              : the reference cost-table method; every reviewer expects it.
#   - AEFT (2025)       : improved optimistic cost matrix, recent, strongest
#                         published cost-table method on the internal split.
#   - BPPTS (2025)      : balanced predictive cost matrix, recent.
#   - LEFT (2025)       : recent, different family (level-based earliest finish).
#   - Look-ahead HEFT   : the lookahead representative; the closest published
#                         competitor to CGS's placement decision.
#
# Excluded on purpose:
#   - OPPTS: unpublished, so not citable as a baseline.
#   - CACL: shared-bus contention model, not comparable to CGS's fixed-cost model.
#   - Learned / RL schedulers: out of scope for this paper.
#
# Results are cached per algorithm: changing its source, args or flags reruns it.

[heft_ins]
# HEFT with insertion-based placement (Topcuoglu et al., TPDS 13(3), 2002).
source = "experiments/cgs/heft_ins.cpp"

[peft]
# PEFT: list scheduling by an optimistic cost table (Arabnejad & Barbosa, TPDS 25(3), 2014).
source = "algorithms/makespan/peft.cpp"

[aeft]
# AEFT: improved optimistic cost matrix (Wang et al., FGCS 164, 2025).
source = "algorithms/makespan/aeft.cpp"

[bppts]
# BPPTS: balanced predictive cost matrix (Wang et al., FGCS 166, 2025).
source = "algorithms/makespan/bppts.cpp"

[left]
# LEFT: level-based earliest finish time (Naik & Ansari, Cluster Computing 28, 2025).
source = "algorithms/makespan/left.cpp"

[la_heft]
# Look-ahead HEFT, depth-1 "max" variant, insertion-based
# (Bittencourt, Sakellariou & Madeira, PDP 2010).
source = "experiments/cgs/la_heft.cpp"

[cgs]
# Proposed method: Contention-table, Gated join-closure Scheduling.
source = "experiments/cgs/cgs.cpp"

[cgs_single]
# Ablation: no join closures (insertion list scheduling with the contention table).
source = "experiments/cgs/cgs.cpp"
args = ["single"]

[cgs_credit0]
# Ablation: plain rank gate, no communication credit.
source = "experiments/cgs/cgs.cpp"
args = ["credit=0"]
