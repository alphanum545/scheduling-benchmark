# Algorithm registry. Add one block per algorithm; the block name is the algorithm's ID.
#
#   source      path to a single .cpp file (relative to the repository root)
#   input       "d3"  = stripped file: n p, computation matrix, communication matrix (default)
#               "raw" = the original D1/D2 file, unchanged (e.g. energy algorithms)
#   output      "schedule" = prints a table "task start finish processor" after a header line;
#                            every schedule is validated (default)
#               "makespan" = prints only the makespan; checked against the lower bound only
#   args        command-line arguments, e.g. ["1.0"]
#   duplication true if the algorithm may duplicate the entry task (LSTD)
#   enabled     false to exclude from "all"
#   timeout     seconds per run (default 900)
#   flags       compiler flags (default "-O2 -std=c++17")
#
# Results are cached per algorithm: changing its source, args or flags reruns it automatically.

[heft]
source = "algorithms/makespan/heft.cpp"

[cpop]
source = "algorithms/makespan/cpop.cpp"
enabled = false

[peft]
source = "algorithms/makespan/peft.cpp"

[ipeft]
source = "algorithms/makespan/ipeft.cpp"

[mpeft]
source = "algorithms/makespan/mpeft.cpp"

[lstd]
source = "algorithms/makespan/lstd.cpp"
duplication = true

[ppts]
source = "algorithms/makespan/ppts.cpp"

[ippts]
source = "algorithms/makespan/ippts.cpp"

[aeft]
source = "algorithms/makespan/aeft.cpp"

[oppts]
# OPPTS as defined in the paper: rank = mean(OPCM)
source = "algorithms/makespan/oppts.cpp"

[oppts_outdeg]
# OPPTS as originally coded: rank = mean(OPCM) x out-degree
source = "algorithms/makespan/oppts_outdeg.cpp"
enabled = false

[cpmin]
# critical-path lower bound (prints one number); reads the 5 parameter vectors, so it gets D2 layout
source = "algorithms/makespan/cpmin.cpp"
input = "d2"
output = "makespan"
enabled = false

# ---------------------------------------------------------------------------
# Energy-constrained DVFS schedulers (algorithms/energy/).
#
# ALL OF THEM ARE DISABLED (enabled = false), so "all" never runs them and the
# benchmark stays purely about makespan. Their sources are kept here for
# reference; run them explicitly when you want them, e.g.
#
#   algos=eheft,esecc,isaecc,mslecc,rep,rsmecc
#
# They all read the 5 energy-parameter vectors, so they need input = "d2",
# and they print only a makespan, so output = "makespan".
# argv[1] is the energy-budget multiplier PARAM: the global budget is
# (1 + PARAM) * E_min_g, so PARAM=1 means twice the minimum feasible energy.
# NOTE: ESECC is the odd one out - it uses PARAM * E_min_g, so at PARAM=1 it
# runs on half the energy of the others. See REPO_ANALYSIS.md section 12.1.
# ---------------------------------------------------------------------------

[eheft]
# weighted-slack energy sharing; ESMM-style priority; has a safe fallback
source = "algorithms/energy/EHEFT.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

[esecc]
source = "algorithms/energy/ESECC.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

[isaecc]
source = "algorithms/energy/ISAECC.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

[mslecc]
source = "algorithms/energy/MSLECC.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

[rep]
source = "algorithms/energy/REP.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

[rsmecc]
source = "algorithms/energy/RSMECC.cpp"
input = "d2"
output = "makespan"
args = ["1.0"]
enabled = false

# The two D1-layout variants read ONE EXTRA leading vector that the "d2"
# conversion drops, so they need the untouched file (input = "raw").
# That makes them D1-only: run them with datasets = D1
# (LIGO, Montage, Genome).
[erws]
source = "algorithms/energy/ERWS.cpp"
input = "raw"
output = "makespan"
args = ["1.0"]
enabled = false

[algo3]
source = "algorithms/energy/algo3.cpp"
input = "raw"
output = "makespan"
args = ["1.0"]
enabled = false

# ---------------------------------------------------------------------------
# Candidate methods for the OPPTS rewrite (one configurable source, lab.cpp).
# Disabled so that "all" stays the published baselines; run them explicitly, e.g.
#   algos=aeft,oppts,heft,lab_aeft,m3,m2,m2h,m1,m5   split=dev
# lab_aeft must reproduce aeft exactly (sanity check of the shared code).
# ---------------------------------------------------------------------------
[lab_aeft]
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=aeft"]
enabled = false

[m3]
# state-aware look-ahead, critical child only
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=look1"]
enabled = false

[m2]
# state-aware look-ahead, all children (contention-aware)
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=lookall"]
enabled = false

[m2h]
# m2 plus half of the task's own cost on the processor (heterogeneity preference)
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=lookall", "own=0.5"]
enabled = false

[m1]
# heterogeneity-regret rank with AEFT selection
source = "algorithms/makespan/lab.cpp"
args = ["rank=regret:1", "sel=aeft"]
enabled = false

[m5]
# hybrid: regret rank + all-children state-aware look-ahead
source = "algorithms/makespan/lab.cpp"
args = ["rank=regret:0.5", "sel=lookall", "own=0.5"]
enabled = false

# --- round 2: isolate the effect of state-awareness ---
[a1]
# AEFT with its static look-ahead replaced by the state-aware one (keeps AEFT's fan-out rule)
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=lookall", "own=1", "switch=1"]
enabled = false

[a2]
# a1 without the fan-out rule
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=lookall", "own=1"]
enabled = false

[a3]
# a1 with the critical child only
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=look1", "own=1", "switch=1"]
enabled = false

[a4]
# a1 with half the own-cost term
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=lookall", "own=0.5", "switch=1"]
enabled = false

[a5]
# diagnostic: AEFT selection without double-counting the task's own cost (static OCT)
source = "algorithms/makespan/lab.cpp"
args = ["rank=mean", "sel=oct"]
enabled = false

# ---------------------------------------------------------------------------
