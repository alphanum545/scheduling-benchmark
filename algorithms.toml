# Algorithms used in the CGS evaluation (and nothing else). DSLA is not part of this study.
#
# Placement: every compared method uses insertion (earliest idle gap that fits), as CGS does.
# The *_ins sources are copies of the repository baselines with only the start-time rule changed;
# their `append` argument restores the original rule and reproduces the original output exactly.
# cgs.cpp, the *_ins.cpp files and la_heft.cpp are from alphanum545/scheduling-benchmark,
# branch research/cgs-20261027 (experiments/cgs); pmms_ins.cpp was written for this package.
# Append-only sources (algorithms/makespan) are identical to commit 2f078d8.

# --- baselines (insertion)
[heft_ins]
source = "algorithms/insertion/heft_ins.cpp"
[peft_ins]
source = "algorithms/insertion/peft_ins.cpp"
[ippts_ins]
source = "algorithms/insertion/ippts_ins.cpp"
[aeft_ins]
source = "algorithms/insertion/aeft_ins.cpp"
[pmms_ins]
source = "algorithms/insertion/pmms_ins.cpp"
[bppts_ins]
source = "algorithms/insertion/bppts_ins.cpp"
[la_heft]
source = "algorithms/insertion/la_heft.cpp"

# --- proposed method (frozen configuration, research/cgs-20261027 PROTOCOL.md)
[cgs]
source = "algorithms/insertion/cgs.cpp"

# --- ablations and sensitivity (options documented in cgs.cpp)
[cgs_single]
source = "algorithms/insertion/cgs.cpp"
args = ["single"]
[cgs_credit0]
source = "algorithms/insertion/cgs.cpp"
args = ["credit=0"]
[cgs_nogate]
source = "algorithms/insertion/cgs.cpp"
args = ["nogate"]
[cgs_lam0]
source = "algorithms/insertion/cgs.cpp"
args = ["lam=0"]
[cgs_tailnone]
source = "algorithms/insertion/cgs.cpp"
args = ["tail=none"]
[cgs_commitall]
source = "algorithms/insertion/cgs.cpp"
args = ["commit=all"]
[cgs_parents3]
source = "algorithms/insertion/cgs.cpp"
args = ["parents=3"]

# --- the same baselines as published in the repository (append-only placement), for context
[heft]
source = "algorithms/makespan/heft.cpp"
[peft]
source = "algorithms/makespan/peft.cpp"
[ippts]
source = "algorithms/makespan/ippts.cpp"
[aeft]
source = "algorithms/makespan/aeft.cpp"
[pmms]
source = "algorithms/makespan/pmms.cpp"
[bppts]
source = "algorithms/makespan/bppts.cpp"

# --- methods discussed but not used as baselines (append-only, as in the repository)
[cpop]
source = "algorithms/makespan/cpop.cpp"
[ppts]
source = "algorithms/makespan/ppts.cpp"
[ipeft]
source = "algorithms/makespan/ipeft.cpp"
[mpeft]
source = "algorithms/makespan/mpeft.cpp"
[lstd]
source = "algorithms/makespan/lstd.cpp"
duplication = true
[left]
source = "algorithms/makespan/left.cpp"
[left_d]
source = "algorithms/makespan/left.cpp"
args = ["dup"]
duplication = true
