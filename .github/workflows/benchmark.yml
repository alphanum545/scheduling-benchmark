name: DSLA bounded source export
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dsla-evidence-export-20261024
          fetch-depth: 0
      - name: Export only named public research sources as bounded text
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          ref='2f078d86b9d39835756f6ed9613279418a52371b'
          out=Path('audit-source-export'); out.mkdir(exist_ok=True)
          entries=[]
          paths=['algorithms.toml','tools/bench.py','tools/evaluate.cpp','tools/report.py']
          for i,p in enumerate(paths):
              b=subprocess.check_output(['git','show',ref+':'+p]); text=b.decode('utf-8')
              chunks=[text[j:j+6500] for j in range(0,len(text),6500)]
              names=[]
              for j,ch in enumerate(chunks):
                  name=f'{i:02d}-{j:02d}.txt'; (out/name).write_text(ch,encoding='utf-8'); names.append(name)
              entries.append({'path':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(),'chunks':names})
          (out/'manifest.json').write_text(json.dumps({'source_commit':ref,'files':entries},indent=2)+'\n')
          PY
      - name: Commit export only to isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-source-export
          git diff --staged --quiet || git commit -m 'audit: expose bounded copies of four pinned public source files'
          git push origin HEAD:refs/heads/audit/dsla-evidence-export-20261024
